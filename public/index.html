<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1C2433">
<title>수업 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#1C2433;--ink2:#4A5263;--mute:#7C8494;--line:#E3DFD5;--paper:#F6F4EF;--card:#fff;--go:#1F7A5C;--go-bg:#E3F2EC;--warn:#B45309;--warn-bg:#FDF1DF;--bad:#B42318;--bad-bg:#FDECEA;--sel:#1C2433}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#F3F1EA;padding-top:env(safe-area-inset-top)}
.top .in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top b{font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.top .who{margin-left:auto;font-size:13px;color:#B9BFCA;white-space:nowrap}
.top button{background:none;border:1px solid #3A4458;color:#D7DBE3;border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer}
.tabs{max-width:1000px;margin:0 auto;padding:0 12px 10px;display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:none;color:#9AA2B1;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#F3F1EA;color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:14px 16px 120px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.datebar .d{font-size:20px;font-weight:700;letter-spacing:-.02em}
.datebar input[type=date]{border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff}
.ib{border:1.5px solid var(--line);background:#fff;border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:16px}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.go{background:var(--go);border-color:var(--go);color:#fff}
.btn.red{color:var(--bad);border-color:#F2C6C1}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.card>.hd{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:14px 16px;cursor:pointer}
.card>.hd h3{margin:0;font-size:17px;letter-spacing:-.02em}
.card>.bd{padding:0 16px 16px;display:none}
.card.open>.bd{display:block}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:#EEEBE3;color:var(--ink2);white-space:nowrap}
.tag.go{background:var(--go-bg);color:var(--go)}.tag.strong{font-size:13px;padding:3px 10px}.tag.bad.strong{background:var(--bad);color:#fff}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.sp{flex:1}
.lesson{background:#FAF9F5;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.lesson .row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:start;margin-bottom:8px}
.lesson .row label{font-size:13px;color:var(--mute);padding-top:7px;font-weight:600}
.lesson input,.lesson textarea,.f input,.f select,.f textarea,.note input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;outline:none}
.lesson textarea{resize:vertical;min-height:38px}
input:focus,textarea:focus,select:focus{border-color:var(--ink)!important}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 10px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.seg button+button{border-left:1.5px solid var(--line)}
.seg.mini{flex-shrink:0}
.mopt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 6px;font-size:13px}
.mopt label{display:flex;align-items:center;gap:5px;font-weight:600;cursor:pointer}
.mopt input{width:16px;height:16px;accent-color:var(--ink)}
.mopt small{color:var(--mute)}
.seg.mini button{padding:3px 8px;font-size:12px}
.seg button.on{background:var(--sel);color:#fff}
.seg.att button.on[data-v=late]{background:var(--warn)}.seg.att button.on[data-v=out]{background:var(--bad)}
.seg.hw button.on[data-v=done]{background:var(--go)}.seg.hw button.on[data-v=part]{background:var(--warn)}.seg.hw button.on[data-v=none]{background:var(--bad)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prevhw{font-size:13px;color:var(--ink2);background:#fff;border:1px dashed var(--line);border-radius:9px;padding:6px 9px;margin:4px 0 10px}
.stu{border-top:1px solid var(--line);padding:12px 0}
.rot{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:10px}
.rot span{border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:#fff;font-weight:600}
.rot span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rot i{font-style:normal}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.thumbs:empty{display:none}
.th{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:#000;display:inline-block}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;pointer-events:none}
.th button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.hwp{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.hwp button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer}
.hwp button.on{background:var(--go-bg);border-color:var(--go);color:var(--go)}
.stu .nm{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;margin-bottom:8px}
.stu .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stu .line small{color:var(--mute);font-size:12px;min-width:48px}
.note{margin-top:8px}
.mini{font-size:13px;color:var(--ink2);margin:0 0 8px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.savebar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));margin-top:12px;display:flex;gap:8px;justify-content:flex-end}
.savebar .btn{box-shadow:0 4px 14px rgba(28,36,51,.15)}
.empty{color:var(--mute);text-align:center;padding:40px 12px}
.msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.msg .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.msg textarea{width:100%;min-height:80px;overflow:hidden;border:1.5px solid var(--line);border-radius:10px;padding:9px;resize:vertical;line-height:1.5;background:#FCFBF8}
.msg.sent textarea{background:#F3F6F4;color:var(--ink2)}
.msg input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.info{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;color:var(--ink2)}
.info.warn{background:var(--warn-bg);border-color:#F2D6AE;color:#7A3E04}
.info.ok{background:var(--go-bg);border-color:#BFE0D2;color:#165C45}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
td{word-break:keep-all}td b{white-space:nowrap}
.sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.sec h3{margin:0 0 4px;font-size:17px}.sec .sub{margin:0 0 12px;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:4px;color:var(--ink2)}
.f small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{display:inline-flex}.days input{display:none}
.days span{border:1.5px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;font-weight:600;background:#fff}
.days input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(20,24,33,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.modal .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h3{margin:0 0 12px}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:60;display:none;max-width:90vw}
.login{max-width:420px;margin:10vh auto;padding:0 16px}
.login .box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 20px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.people button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;cursor:pointer}
.people button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.login input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px;margin-top:8px;outline:none}
.err{color:var(--bad);font-size:14px;margin:8px 0 0;min-height:1em}
.paste{width:100%;min-height:140px;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}.lesson .row{grid-template-columns:minmax(0,1fr)}.lesson .row label{padding-top:0}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TK = "cm.token";
let token = null; try { token = localStorage.getItem(TK); } catch {}
const S = { me: null, tab: "day", date: null, today: null, setup: null, day: null, kind: "daily" };
const DOW = "일월화수목금토";
const ATT = [["in", "출석"], ["late", "지각"], ["out", "결석"]];
const HW = [["done", "완료"], ["part", "미흡"], ["none", "미제출"]];
const PHR = [["greet", "{인사} 첫인사"], ["close", "{마무리} 끝인사"], ["done", "{숙제 멘트} 숙제 완료일 때"], ["part", "{숙제 멘트} 숙제 미흡일 때"], ["none", "{숙제 멘트} 숙제 미제출일 때"], ["late", "{출석 멘트} 지각일 때"], ["out", "{출석 멘트} 결석일 때"], ["weekGood", "{주간 멘트} 숙제 80% 이상"], ["weekMid", "{주간 멘트} 숙제 50~79%"], ["weekLow", "{주간 멘트} 숙제 50% 미만"]];
const courses = () => (S.settings && S.settings.courses) || [];
// a curriculum <select> grouped by 과정; onlyCourse limits the list
function curOptions(list, val, empty, onlyCourse) {
  // a 진도표 without 과정 is shared by every 과정, so it always stays in the list
  const groups = [...courses(), ""].map((co) => [co, list.filter((x) => (x.course || "") === co && (!onlyCourse || !x.course || x.course === onlyCourse))]).filter(([, l]) => l.length);
  const extra = list.filter((x) => x.course && !courses().includes(x.course) && (!onlyCourse || x.course === onlyCourse));
  if (extra.length) groups.push(["기타", extra]);
  return `<option value="">${esc(empty)}</option>` + groups.map(([co, l]) => `<optgroup label="${esc(co || "모든 과정 공통")}">${l.map((x) => `<option value="${x.id}" ${x.id === val ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</optgroup>`).join("");
}
const ATA = [["daily", "일간 리포트"], ["missing", "미제출 알림"], ["warn", "누적 알림"], ["weekly", "주간 리포트"], ["monthly", "월간 리포트"], ["att_in", "등원 알림"], ["att_late", "지각 알림"], ["att_out", "결석·미도착 알림"]];
// #{변수} names the app can fill (same list as the server, plus common aliases)
const ATA_KNOWN = ["학원", "학생명", "반", "날짜", "출석", "오늘할일", "숙제", "다음수업", "지난숙제내용", "지난숙제결과", "선생님한마디", "인사", "마무리", "출석멘트", "숙제멘트", "주간멘트", "기간", "출석요약", "숙제완료율", "진도", "코멘트", "누적횟수", "누적날짜", "수업시간", "현재시각",
  "이름", "학생", "학생이름", "원생명", "자녀명", "학원명", "학원이름", "수업내용", "오늘수업", "배운내용", "진도내용", "오늘배운내용", "과제", "오늘숙제", "다음수업내용", "숙제결과", "숙제확인", "한마디", "선생님코멘트", "출결", "출석여부", "일자", "수업일", "시간", "도착시간", "반이름", "클래스", "횟수", "미제출횟수", "사진링크", "사진주소", "사진", "사진보기", "링크", "사진url", "학습내용", "수업진도", "오늘진도", "오늘의수업진도", "학습", "오늘학습내용", "수업활동", "전달사항", "선생님전달사항", "특이사항", "숙제안내", "숙제내용", "사진코드"];
function ataCheck(body) {
  const names = [...String(body || "").matchAll(/#\{([^{}]+)\}/g)].map((m) => m[1]);
  if (!names.length) return "";
  const bad = names.filter((n) => !ATA_KNOWN.includes(n.replace(/\s/g, "")));
  return bad.length ? `<span style="color:var(--bad)">채울 수 없는 칸: ${bad.map((b) => "#{" + esc(b) + "}").join(" ")} → "-"로 들어가요</span>` : `<span style="color:var(--go)">칸 ${names.length}개 모두 자동으로 채워져요 ✓</span>`;
}
// Suggested 알림톡 template text to submit for Kakao review. 쿠션멘트형 = 기본형 + #{인사} … #{마무리}.
const ATA_SUG = {
  daily: "#{학원}입니다.\n#{학생명} 학생의 오늘(#{날짜}) 수업 안내드립니다.\n\n■ 출석: #{출석}\n■ 오늘 수업: #{오늘할일}\n■ 숙제: #{숙제}\n■ 다음 수업: #{다음수업}\n■ 지난 숙제: #{지난숙제결과}\n■ 선생님 한마디: #{선생님한마디}\n■ 수업 사진: #{사진주소}",
  missing: "#{학원}입니다.\n#{학생명} 학생의 숙제 안내드립니다.\n\n■ 날짜: #{날짜}\n■ 숙제 확인: #{지난숙제결과}\n■ 숙제 내용: #{지난숙제내용}\n\n가정에서 한 번 확인 부탁드립니다.",
  warn: "#{학원}입니다.\n#{학생명} 학생의 숙제가 #{누적횟수}회 제출되지 않아 안내드립니다.\n\n■ 미제출 날짜: #{누적날짜}\n\n가정에서 숙제 확인 부탁드립니다.",
  weekly: "#{학원}입니다.\n#{학생명} 학생의 주간 리포트(#{기간})입니다.\n\n■ 출석: #{출석요약}\n■ 숙제 완료율: #{숙제완료율}\n■ 진도: #{진도}\n■ 선생님 코멘트: #{코멘트}",
  monthly: "#{학원}입니다.\n#{학생명} 학생의 월간 리포트(#{기간})입니다.\n\n■ 출석: #{출석요약}\n■ 숙제 완료율: #{숙제완료율}\n■ 진도: #{진도}\n■ 선생님 코멘트: #{코멘트}",
  att_in: "#{학원}입니다.\n#{학생명} 학생이 #{현재시각}에 등원했습니다.",
  att_late: "#{학원}입니다.\n#{학생명} 학생이 #{현재시각}에 등원했습니다. (수업 시간 #{수업시간})",
  att_out: "#{학원}입니다.\n#{학생명} 학생이 #{수업시간} 수업에 아직 도착하지 않았습니다.\n확인 부탁드립니다.",
};
function ataSuggest(k, st) {
  const b = ATA_SUG[k] || "";
  if (st !== "cushion") return b;
  const [first, ...rest] = b.split("\n"), extra = k === "daily" ? "\n#{숙제멘트}" : k === "weekly" || k === "monthly" ? "\n#{주간멘트}" : "";
  return `${first}\n#{인사}\n${rest.join("\n")}${extra}\n\n#{마무리}`;
}
const KIND = { daily: "일간", missing: "미제출 알림", warn: "누적 알림", weekly: "주간", monthly: "월간" };
const ST = { draft: ["대기", ""], sent: ["✓ 전송됨", "go"], failed: ["✕ 실패", "bad"] };
// 오늘 수업 화면의 학생 이름 옆: 학부모 리포트 상태
const hm = (t) => (t ? new Date(t).toTimeString().slice(0, 5) : "");
function dailyTag(d) {
  if (!d) return "";
  if (d.status === "sent") return `<span class="tag go strong">✓ 학부모 전송됨 ${hm(d.at)}</span>`;
  if (d.status === "failed") return `<span class="tag bad strong" title="${esc(d.err || "")}">✕ 전송 실패</span>`;
  if (d.hold) return `<span class="tag warn">${esc(d.hold)} · 따로 보내기</span>`;
  return d.checked ? '<span class="tag">리포트 대기</span>' : '<span class="tag">보내지 않음</span>';
}

function toast(m) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), 2600); }
async function api(path, body, method) {
  const r = await fetch(path, { method: method || (body ? "POST" : "GET"), headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith("/api/auth/")) { logout(); throw new Error("다시 로그인해 주세요."); }
  if (!r.ok) throw new Error(d.error || "요청을 처리하지 못했어요.");
  return d;
}
function logout() { token = null; try { localStorage.removeItem(TK); } catch {} S.me = null; boot(); }
const dlabel = (d) => `${+d.slice(5, 7)}월 ${+d.slice(8)}일 (${DOW[new Date(d + "T00:00:00Z").getUTCDay()]})`;
const addDays = (d, n) => new Date(Date.parse(d + "T00:00:00Z") + n * 864e5).toISOString().slice(0, 10);
const bytes = (t) => [...t].reduce((n, c) => n + (c.charCodeAt(0) < 128 ? 1 : 2), 0);
function modal(html) { $("#mbox").innerHTML = html; $("#modal").classList.add("on"); }
function closeModal() { $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

/* ---------------- login ---------------- */
async function boot() {
  if (token) {
    try { const d = await api("/api/me"); S.me = d.me; S.today = d.today; S.date = S.date || d.today; S.sms = d.sms; S.settings = d.settings; return shell(); } catch {}
  }
  const st = await api("/api/auth/state").catch(() => ({ setup: false, people: [] }));
  let who = "director";
  const setupMode = !st.setup;
  $("#app").innerHTML = `<div class="login"><div class="box">
    <h2 style="margin:0 0 4px;font-size:22px">수업 관리</h2>
    <p style="margin:0;color:var(--mute);font-size:14px">${setupMode ? "처음이에요. 학원 이름과 원장 비밀번호(6자 이상)를 정해 주세요." : "누구신지 고르고 비밀번호를 입력해 주세요."}</p>
    ${setupMode ? "" : `<div class="people">${st.people.map((p) => `<button data-who="${esc(p.id)}" class="${p.id === who ? "on" : ""}">${esc(p.name)}${p.room ? ` · ${esc(p.room)}` : ""}</button>`).join("")}</div>`}
    <form id="lf">${setupMode ? '<input id="acad" placeholder="학원 이름 (예: 해피영어학원)" autocomplete="organization">' : ""}<input type="password" id="pw" placeholder="비밀번호" autocomplete="${setupMode ? "new-password" : "current-password"}">
    ${setupMode ? '<input type="password" id="pw2" placeholder="비밀번호 한 번 더" autocomplete="new-password">' : ""}
    <button class="btn dark" style="width:100%;margin-top:12px;padding:12px">${setupMode ? "만들고 시작하기" : "들어가기"}</button><p class="err" id="lerr"></p></form></div></div>`;
  $$(".people button").forEach((b) => (b.onclick = () => { who = b.dataset.who; $$(".people button").forEach((x) => x.classList.toggle("on", x === b)); $("#pw").focus(); }));
  $("#lf").onsubmit = async (e) => {
    e.preventDefault(); $("#lerr").textContent = "";
    try {
      if (setupMode && $("#pw").value !== $("#pw2").value) throw new Error("두 비밀번호가 서로 달라요.");
      const d = await api(setupMode ? "/api/auth/setup" : "/api/auth/login", { who, password: $("#pw").value, academy: setupMode ? $("#acad").value : undefined });
      token = d.token; try { localStorage.setItem(TK, token); } catch {}
      boot();
    } catch (err) { $("#lerr").textContent = err.message; }
  };
}

function dateBar(extra = "") {

/* ---------------- 오늘 수업 ---------------- */
let dirty = new Set();
/* ----- 자동 저장: 입력 2초 뒤 서버에 저장 + 이 기기에 임시 보관 (탭 이동·새로고침·인터넷 끊김에도 안 사라지게) ----- */
const pending = new Map();
async function flushSaves() { const fns = [...pending.values()]; pending.clear(); for (const f of fns) { try { await f(); } catch {} } }
window.addEventListener("pagehide", () => { flushSaves(); });
// 저장 전에 창을 닫거나 새로고침하면 한 번 물어봐요 (그 사이 저장도 시작)
window.addEventListener("beforeunload", (e) => { if (pending.size) { flushSaves(); e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSaves(); });
const draftKey = (date, cid) => `cm-draft:${date}:${cid}`;
function gather(el) {
  const units = $$(".lesson", el).map((b) => ({
    unit: b.dataset.unit, cur: b.dataset.curid || null, seq: $("[data-f=seq]", b) ? +$("[data-f=seq]", b).value : null,
    adv: $(".seg.adv .on", b) ? $(".seg.adv .on", b).dataset.v === "1" : true,
    today: $("[data-f=today]", b).value, next: $("[data-f=next]", b).value, hw: $("[data-f=hw]", b).value,
    nextpick: ($("[data-f=nextpick]", b) || {}).value || "", key: b.dataset.key,
    ...(() => { const v = ($("[data-f=nextpick]", b) || {}).value || ""; const [nc, ns] = v.split("|"); return { ncur: nc || null, nseq: ns ? +ns : null }; })(),
  }));
  const students = $$(".stu", el).map((s) => ({ id: s.dataset.sid, att: ($(".seg.att .on", s) || {}).dataset?.v || "", hwprev: ($(".seg.hw .on", s) || {}).dataset?.v || "", note: $("[data-f=note]", s).value, hold: (($(".seg.hold .on", s) || {}).dataset?.v || "") || (($(".seg.att .on", s) || {}).dataset?.v === "out" ? "auto" : "") }));
  return { units, students };
}
function saveDraft(date, cid, el) { try { localStorage.setItem(draftKey(date, cid), JSON.stringify({ at: Date.now(), ...gather(el) })); } catch {} }
function dropDraft(date, cid) { try { localStorage.removeItem(draftKey(date, cid)); } catch {} }
function readDraft(date, cid) { try { return JSON.parse(localStorage.getItem(draftKey(date, cid)) || "null"); } catch { return null; } }
// put an unsaved draft back on screen
function applyDraft(el, d) {
  for (const u of d.units || []) {
    const b = $(`.lesson[data-key="${u.key}"]`, el); if (!b) continue;
    const seq = $("[data-f=seq]", b); if (seq && u.seq != null && [...seq.options].some((o) => +o.value === u.seq)) seq.value = String(u.seq);
    for (const f of ["today", "next", "hw"]) { const t = $(`[data-f=${f}]`, b); if (t && u[f] != null) t.value = u[f]; }
    const np = $("[data-f=nextpick]", b); if (np && [...np.options].some((o) => o.value === u.nextpick)) np.value = u.nextpick;
    $$(".seg.adv button", b).forEach((x) => x.classList.toggle("on", (x.dataset.v === "1") === !!u.adv));
    $$("[data-hwp]", b).forEach((x) => x.classList.toggle("on", hwHas(u.hw || "", x.dataset.hwp)));
  }
  for (const st of d.students || []) {
    const r = $(`.stu[data-sid="${st.id}"]`, el); if (!r) continue;
    if (st.hwprev) $$(".seg.hw button", r).forEach((x) => x.classList.toggle("on", x.dataset.v === st.hwprev));
    if (st.note) { $("[data-f=note]", r).value = st.note; $(".note", r).hidden = false; }
    if (st.hold !== undefined) setHold(r, st.hold === "auto" ? "" : st.hold);
  }
}
async function renderDay() {

}
const ALERT = { att_in: "등원", att_late: "지각", att_out: "결석" };
const hwParts = (t) => String(t || "").split(/\s*,\s*/).filter(Boolean);
const hwHas = (t, h) => hwParts(t).some((p) => p === h || p.startsWith(h + " "));
function seqRow(u) {
  if (!u.lessons.length) return u.cur ? "" : `<p class="mini">진도표가 연결되지 않았어요. 내용을 직접 적어 주세요.</p>`;
  const opts = u.lessons.map((l) => `<option value="${l.seq}" ${l.seq === u.seq ? "selected" : ""}>${l.seq}. ${esc(l.title || l.content || "")}</option>`).join("");
  return `<div class="row"><label>차시</label><div class="ctrl"><select data-f="seq" style="max-width:100%;flex:1;min-width:0;border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff">${opts}${!u.lessons.some((l) => l.seq === u.seq) ? `<option value="${u.seq}" selected>진도표 끝</option>` : ""}</select></div></div>`;
}
const lt = (l) => (l ? [l.title, l.content].filter(Boolean).join(" · ") : "");
// same rule as the server: with a rotation, "다음 수업" is the next program in line
function nextTextC(u, cur, seq) {
  const here = (u.progs || []).find((p) => p.id === cur);
  const nextL = (p, sq) => (p ? p.lessons.find((l) => l.seq > sq) || (p.loop ? p.lessons[0] : null) : null);
  if (u.rot && u.rot.length > 1 && u.rot.includes(cur)) {
    const nid = u.rot[(u.rot.indexOf(cur) + 1) % u.rot.length], np = (u.progs || []).find((p) => p.id === nid);
    if (!np) return "";
    const L = nid === cur ? nextL(np, seq) : np.lessons.find((l) => l.seq === np.pos);
    return L ? `${np.name} · ${lt(L)}` : np.name;
  }
  return lt(nextL(here, seq));
}
// "다음 수업" dropdown: 자동(순서대로) or any lesson of any 진도표
function nextPicker(u) {
  const all = S.day.curricula || [], la = S.day.lessonsAll || {};
  const val = u.ncur ? `${u.ncur}|${u.nseq ?? ""}` : "";
  const groups = all.map((c) => {
    const ls = la[c.id] || [];
    const opts = ls.length ? ls.map((l) => `<option value="${c.id}|${l.seq}" ${val === `${c.id}|${l.seq}` ? "selected" : ""}>${esc(c.name)} · ${l.seq}. ${esc(l.title || l.content || "")}</option>`).join("") : `<option value="${c.id}|" ${val === `${c.id}|` ? "selected" : ""}>${esc(c.name)}</option>`;
    return `<optgroup label="${esc(c.name)}">${opts}</optgroup>`;
  }).join("");
  return `<select data-f="nextpick" style="max-width:100%;min-width:0;border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff"><option value="">자동 (순서대로 다음 수업)</option>${groups}</select>`;
}
function nextPickText(u, val, todayCur) {
  const [cur, sq] = val.split("|"), c = (S.day.curricula || []).find((x) => x.id === cur);
  const L = ((S.day.lessonsAll || {})[cur] || []).find((l) => String(l.seq) === sq);
  if (!c) return "";
  if (!L) return c.name;
  return cur === todayCur && !(u.rot && u.rot.length > 1) ? lt(L) : `${c.name} · ${lt(L)}`;

function fillLesson(box, u, cur, seq) {
  const p = (u.progs || []).find((x) => x.id === cur);

    const sentChip = (st) => (st === "sent" ? '<span class="tag go">알림 보냄</span>' : st === "failed" ? '<span class="tag bad">알림 실패</span>' : st === "draft" ? '<span class="tag">알림 대기</span>' : "");
    $("#hs").innerHTML = d.classes.length ? `
      <div class="bar"><span style="font-size:14px;color:var(--ink2)">이날 숙제 ${S.settings.missingPart ? "미제출·미흡" : "미제출"} <b>${missN}명</b></span><span class="sp"></span>
        <button class="btn dark" id="mkmiss" ${missN ? "" : "disabled"}>학부모 미제출 알림 만들기</button></div>
      ${d.classes.map((c) => `<div class="sec"><h3>${esc(c.name)} <span class="tag">${c.kind === "group" ? "그룹" : "개별"}</span></h3>
        <table><thead><tr><th>학생</th><th>지난 숙제</th><th>결과</th><th>누적</th><th></th></tr></thead><tbody>${c.rows.map((r) => `<tr><td><b>${esc(r.name)}</b>${r.hasPhone ? "" : ' <span class="tag warn">번호 없음</span>'}</td><td style="font-size:13px;color:var(--ink2)">${esc(r.hwText || "-")}</td><td>${r.att === "out" ? '<span class="tag">결석</span>' : chip(r.hwprev)}</td><td>${S.settings.warnOn ? `<span class="tag ${r.miss >= S.settings.warnCount ? "bad" : r.miss ? "warn" : ""}">${r.miss}/${S.settings.warnCount}</span>` : "-"}</td><td>${sentChip(d.sent[r.sid])}${r.hasPhone && d.sent[r.sid] !== "sent" ? `${r.hwprev === "none" || (S.settings.missingPart && r.hwprev === "part") ? ` <button type="button" class="btn sm" data-now="missing" data-sid="${r.sid}" data-nm="${esc(r.name)}">미제출 알림 바로 보내기</button>` : ""}${S.settings.warnOn && r.miss >= S.settings.warnCount ? ` <button type="button" class="btn sm dark" data-now="warn" data-sid="${r.sid}" data-nm="${esc(r.name)}">누적 ${S.settings.warnCount}회 알림 보내기</button>` : ""}` : ""}</td></tr>`).join("")}</tbody></table></div>`).join("")}`
      : `<p class="empty">${dlabel(S.date)}에 저장된 수업 기록이 없어요. "오늘 수업"에서 숙제를 체크하면 여기에 보여요.</p>`;
    $$("[data-now]").forEach((b) => (b.onclick = async () => {
      const kind = b.dataset.now, nm = b.dataset.nm;
      if (!confirm(`${nm} 학부모님께 ${kind === "warn" ? "숙제 누적 알림" : "숙제 미제출 알림"}을 지금 바로 보낼까요?`)) return;
      b.disabled = true;
      try { const r = await api("/api/msgs/sendnow", { date: S.date, kind, sid: b.dataset.sid }); toast(r.sent ? "보냈어요" : r.failed ? "보내지 못했어요. '학부모 메시지' 탭에서 오류를 확인해 주세요" : "보내지 않았어요"); renderMissing(); } catch (e) { toast(e.message); b.disabled = false; }
    }));
    const mk = $("#mkmiss");
    if (mk) mk.onclick = async () => { try { const r = await api("/api/msgs/compose", { date: S.date, kind: "missing" }); toast(`${r.made}건 만들었어요. 확인하고 보내 주세요.`); S.kind = "missing"; S.tab = "msgs"; shell(); } catch (e) { toast(e.message); } };
  } catch (e) { $("#hs").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
  renderAccum();
}
async function renderAccum() {
  S.mrange = S.mrange || "week";
  const ranges = { week: "이번 주", month: "이번 달", d30: "최근 30일" };
  $("#acc").innerHTML = `<div class="bar"><div class="seg" id="rg">${Object.entries(ranges).map(([k, v]) => `<button data-r="${k}" class="${S.mrange === k ? "on" : ""}">${v}</button>`).join("")}</div></div><div id="ms"><p class="empty">불러오는 중…</p></div>`;
  $$("#rg button").forEach((b) => (b.onclick = () => { S.mrange = b.dataset.r; renderAccum(); }));
  const t = S.today, dw = (new Date(t + "T00:00:00Z").getUTCDay() + 6) % 7;
  const from = S.mrange === "week" ? addDays(t, -dw) : S.mrange === "month" ? t.slice(0, 8) + "01" : addDays(t, -29);
  try {
    const d = await api(`/api/missing?from=${from}&to=${t}`);
    $("#ms").innerHTML = d.rows.length ? `<div class="sec"><p class="sub" style="margin-bottom:8px">${dlabel(from)} ~ ${dlabel(t)} · 미제출·미흡이 있는 학생 ${d.rows.length}명</p><table><thead><tr><th>학생</th><th>반</th><th>미제출</th><th>미흡</th><th>날짜</th></tr></thead><tbody>${d.rows.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.cname || "")}</td><td>${r.none ? `<span class="tag bad">${r.none}회</span>` : "-"}</td><td>${r.part ? `<span class="tag warn">${r.part}회</span>` : "-"}</td><td style="font-size:13px;color:var(--ink2)">${r.dates.map((x) => `${+x.date.slice(5, 7)}/${+x.date.slice(8)}${x.v === "none" ? "✕" : "△"}`).join(" ")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">이 기간에 숙제 미제출·미흡 학생이 없어요. 👏</p>`;
  } catch (e) { $("#ms").innerHTML = `<p class="empty">${esc(e.message)}</p>`; }
}

const loadScript = (src) => new Promise((ok, no) => { if ([...document.scripts].some((s) => s.src === src)) return ok(); const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("파일 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.")); document.head.appendChild(s); });
async function fileRows(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".pdf")) {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise, rows = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const items = (await (await pdf.getPage(p)).getTextContent()).items.filter((i) => i.str.trim());
      const lines = [];
      for (const it of items) { const y = it.transform[5]; let l = lines.find((x) => Math.abs(x.y - y) < 3); if (!l) lines.push((l = { y, cells: [] })); l.cells.push({ x: it.transform[4], s: it.str.trim() }); }
      lines.sort((a, b) => b.y - a.y).forEach((l) => rows.push(l.cells.sort((a, b) => a.x - b.x).map((c) => c.s)));
    }
    return rows;
  }
  if (/\.(csv|txt|tsv)$/.test(name)) return textRows(await file.text());
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
  const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
}
function textRows(t) {
  t = String(t || "").replace(/\r\n?/g, "\n");
  const sep = t.includes("\t") ? "\t" : ",", rows = [];
  let row = [], cell = "", q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; continue; }
    if (ch === '"' && cell === "") q = true;
    else if (ch === sep) { row.push(cell.trim()); cell = ""; }
    else if (ch === "\n") { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  row.push(cell.trim()); rows.push(row);
  return rows.filter((r) => r.some((c) => c));
}
const PHONE = /01[016789][\s.\-]?\d{3,4}[\s.\-]?\d{4}/;
const isDayCell = (c) => /^([월화수목금토일](요일)?[\s,\/·.]*)+$/.test(c);
const HEAD = /^(이름|학생|학생명|성명|원생|원생명|학년|반|반이름|클래스|번호|연락처|휴대폰|학부모|학부모번호|비고|요일|수업요일)$/;
function studentsFromRows(rows) {
  const cls = S.setup.classes.map((c) => c.name.replace(/\s+/g, ""));
  const out = [], seen = new Set();
  let H = null; // header row tells which column is 반 / 요일 when the class doesn't exist yet
  for (const r of rows) {
    const raw = r.map((c) => String(c || "").trim());
    const cells = raw.filter(Boolean);
    if (!cells.length) continue;
    if (cells.filter((c) => HEAD.test(c.replace(/\s/g, ""))).length >= 2) { H = cells.map((c) => c.replace(/\s/g, "")); continue; }
    const joined = cells.join(" ");
    const pm = joined.replace(/(\d)\s+(?=\d)/g, "$1").match(PHONE);
    const ci = H ? H.findIndex((h) => /^(반|반이름|클래스)$/.test(h)) : -1;
    let cl = cells.find((c) => cls.includes(c.replace(/\s+/g, ""))) || (ci >= 0 && cells.length === H.length ? cells[ci] : "");
    const dayCells = cells.filter(isDayCell);
    const name = cells.find((c) => /^[가-힣]{2,5}$/.test(c) && !isDayCell(c) && c !== cl && !HEAD.test(c));
    if (!name) continue;
    if (!cl && ci >= 0) { const rest = cells.filter((c) => c !== name && !isDayCell(c) && !PHONE.test(c.replace(/(\d)\s+(?=\d)/g, "$1")) && !/^\d+$/.test(c)); if (rest.length === 1) cl = rest[0]; }
    const phone = pm ? pm[0].replace(/\D/g, "") : "";
    const k = name + phone; if (seen.has(k)) continue; seen.add(k);
    out.push({ name, phone, cls: cl, days: dayCells.join("") });
  }
  return out;
}

  $("#u_f").onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { const rows = await fileRows(f); $("#u_t").value = rows.map((r) => r.join("\t")).join("\n"); prev(); } catch (err) { $("#u_p").textContent = err.message; } };
  $("#msave").onclick = () => act(() => api("/api/curriculum", { id: cur && cur.id, name: $("#u_n").value, course: $("#u_co").value, loop: $("#u_loop").checked, lessons: parse(textRows($("#u_t").value)) }));
  if (cur) $("#mdel").onclick = () => confirm(`${cur.name} 진도표를 삭제할까요? 이 진도표를 쓰던 반은 '없음'이 돼요.`) && act(() => api("/api/curriculum/delete", { id: cur.id }));
}

boot();
</script>
</body>
</html>
